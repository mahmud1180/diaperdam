name: Scrape Diaper Prices

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC = 08:00 BDT daily
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Apply schema (idempotent — seeds new stores)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          conn.autocommit = True
          cur = conn.cursor()
          with open('schema.sql') as f:
              sql = f.read()
          for stmt in sql.split(';'):
              stmt = stmt.strip()
              if stmt and not stmt.startswith('--'):
                  try:
                      cur.execute(stmt)
                  except Exception as e:
                      if 'already exists' not in str(e) and 'duplicate' not in str(e).lower():
                          print(f'Schema stmt error (ignored): {e}')
          cur.close()
          conn.close()
          print('Schema applied OK')
          "

      - name: Run scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd scrapers
          python run_all.py

      - name: Trigger Vercel revalidation
        if: success()
        run: |
          curl -X POST "${{ secrets.VERCEL_REVALIDATE_URL }}" \
            -H "x-revalidate-token: ${{ secrets.REVALIDATE_TOKEN }}" \
            --fail --silent
        continue-on-error: true
