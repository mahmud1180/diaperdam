name: Scrape Diaper Prices

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC = 08:00 BDT daily
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Apply schema (idempotent — seeds new stores)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          conn.autocommit = True
          cur = conn.cursor()
          with open('schema.sql') as f:
              sql = f.read()
          # Execute entire SQL file at once (PostgreSQL handles multi-statement)
          cur.execute(sql)
          # Verify stores exist
          cur.execute('SELECT slug FROM stores ORDER BY slug')
          stores = [r[0] for r in cur.fetchall()]
          print(f'Schema applied OK — stores: {stores}')
          cur.close()
          conn.close()
          "

      - name: Clean junk brands
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'scrapers')
          from brands import BRAND_SLUG_MAP
          import psycopg2
          valid = list(set(BRAND_SLUG_MAP.values()))
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          cur = conn.cursor()
          cur.execute('UPDATE diaper_products SET is_available = FALSE WHERE brand_slug != ALL(%s) AND is_available = TRUE', (valid,))
          print(f'Marked {cur.rowcount} junk-brand products as unavailable')
          conn.commit()
          cur.close()
          conn.close()
          "

      - name: Fix Chaldal product URLs (use search URLs)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          import os, psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          cur = conn.cursor()
          cur.execute(\"\"\"
            SELECT dp.id, dp.product_url, dp.name
            FROM diaper_products dp
            JOIN stores s ON s.id = dp.store_id
            WHERE s.slug = 'chaldal'
              AND dp.product_url IS NOT NULL
              AND dp.product_url NOT LIKE '%/search/%'
          \"\"\")
          rows = cur.fetchall()
          fixed = 0
          for pid, url, name in rows:
              search_q = name.replace(' ', '+')
              new_url = f'https://chaldal.com/search/{search_q}'
              cur.execute('UPDATE diaper_products SET product_url = %s WHERE id = %s', (new_url, pid))
              fixed += 1
          conn.commit()
          print(f'Converted {fixed} Chaldal URLs to search URLs')
          cur.close()
          conn.close()
          "

      - name: Run scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd scrapers
          python run_all.py

      - name: Trigger Vercel revalidation
        if: success()
        run: |
          curl -X POST "${{ secrets.VERCEL_REVALIDATE_URL }}" \
            -H "x-revalidate-token: ${{ secrets.REVALIDATE_TOKEN }}" \
            --fail --silent
        continue-on-error: true
